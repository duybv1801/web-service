<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Người dùng & Phân quyền</title>

    <!-- React CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        /* ---- CSS nền ---- */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; color: #222; background: #f5f6f8; }
        .container { max-width: 1100px; margin: 24px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0, 0, 0, .08); }
        h1 { margin: 0 0 6px; font-size: 22px; }
        h3 { margin: 0; }
        input, select, textarea { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
        textarea { min-height: 70px; resize: vertical; }
        button { padding: 7px 12px; margin: 2px; border: 1px solid #ccc; border-radius: 4px; background: #f3f3f3; font: inherit; cursor: pointer; }
        .error { margin: 4px 0 0; color: #c62828; font-size: 13px; }
        code { font-size: 13px; }

        /* Đăng nhập */
        .login { max-width: 380px; margin: 40px auto; display: flex; flex-direction: column; gap: 6px; }
        .login input { width: 100%; }

        /* Bảng */
        .table-wrap { width: 100%; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; vertical-align: top; }
        th { background: #fafafa; }
        td.actions { white-space: nowrap; }

        /* Phân trang */
        .pagination { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .pager { display: flex; align-items: center; gap: 6px; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .4); z-index: 10; }
        .modal-content { width: 460px; max-height: 90vh; overflow-y: auto; padding: 20px; background: #fff; border-radius: 8px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .modal-header .close { border: 0; background: none; font-size: 22px; line-height: 1; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 16px; }
        .field { margin-top: 10px; }
        .field > label { display: block; margin-bottom: 4px; font-weight: 600; }
        .field > input, .field > textarea { width: 100%; }
        .perm-group { margin: 8px 0; padding: 6px 10px; border: 1px solid #eee; border-radius: 4px; }
        .perm-group legend { font-weight: 600; }
        .profile p { margin: 10px 0; }

        /* ---- Bổ sung (mục 3.11) ---- */
        .header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .muted { color: #666; font-size: 14px; }
        .tabs { display: flex; gap: 4px; border-bottom: 2px solid #eee; margin-bottom: 16px; }
        .tabs button.active { background: #4CAF50; color: #fff; }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .badge { display: inline-block; padding: 2px 8px; margin: 2px; border-radius: 10px; font-size: 12px; background: #e3f2fd; color: #1565c0; }
        .badge.locked { background: #ffebee; color: #c62828; }
        .badge.active { background: #e8f5e9; color: #2e7d32; }
        .badge.system { background: #fff3e0; color: #e65100; }
        button.primary { background: #4CAF50; color: #fff; }
        button.danger { background: #e53935; color: #fff; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .check { display: flex; align-items: flex-start; gap: 8px; font-weight: normal; margin-top: 6px; }
        .toast { position: fixed; right: 16px; bottom: 16px; padding: 12px 16px; border-radius: 6px; color: #fff; max-width: 360px; z-index: 20; }
        .toast.success { background: #2e7d32; }
        .toast.error { background: #c62828; }

        /* ---- Responsive (mục 4.9): breakpoint 768px ---- */
        @media (max-width: 768px) {
            body { font-size: 14px; }
            .container { margin: 0; padding: 12px; border-radius: 0; }
            .table-wrap { overflow-x: auto; }
            table { min-width: 640px; }
            .modal-content { width: 95%; }
            button { min-width: 44px; min-height: 44px; }
            .toolbar > * { flex: 1 1 100%; }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        // TODO: api, components
        // 1. axios instance, interceptor
        const { useState, useEffect, useCallback, useRef } = React;
        const API_BASE = "https://180-93-1-121.sslip.io/api/v1";
        // Làm Frontend trước với mock server của giảng viên:
        // const API_BASE = "<MOCK_URL>/good/api/v1";

        const TOKEN_KEY = "rbac_token";
        const getToken = () => sessionStorage.getItem(TOKEN_KEY);
        const setToken = (t) => (t ? sessionStorage.setItem(TOKEN_KEY, t) :
            sessionStorage.removeItem(TOKEN_KEY));
        const api = axios.create({ baseURL: API_BASE, timeout: 10000 });

        // Request interceptor: tự gắn Bearer token cho MỌI request
        api.interceptors.request.use((config) => {
            const token = getToken();
            if (token) config.headers.Authorization = `Bearer ${token}`;
            return config;
        });

        // Response interceptor: chuẩn hóa lỗi + xử lý 401 tập trung
        api.interceptors.response.use(
            (res) => res,
            (error) => {
                if (!error.response) {
                    return Promise.reject({
                        status: 0, code: "NETWORK_ERROR", details: [],
                        message: error.code === "ECONNABORTED" ? "Máy chủ phản hồi quá lâu." :
                            "Không kết nối được máy chủ (kiểm tra server, mạng hoặc CORS).",
                    });
                }
                const { status, data } = error.response;
                const err = {
                    status,
                    code: data?.error?.code || `HTTP_${status}`,
                    message: data?.error?.message || `Lỗi ${status}`,
                    details: data?.error?.details || [],
                };
                if (status === 401 && !error.config.url.endsWith("/auth/tokens")) {
                    setToken(null);
                    window.dispatchEvent(new Event("auth:expired")); // App lắng nghe để về màn hình đăng nhập
                }
                return Promise.reject(err);
            }
        );

        // Kiểm tra quyền phía giao diện (chỉ để ẩn/hiện)
        const can = (me, perm) => !!me && me.permissions.includes(perm);
        const sameId = (a, b) => String(a) === String(b);

        // Component App
        function App() {
            const [me, setMe] = useState(null);
            const [checking, setChecking] = useState(!!getToken());
            const [tab, setTab] = useState("users");
            const [toast, setToast] = useState(null);
            const toastTimer = useRef(null);

            const notify = useCallback((type, text) => {
                setToast({ type, text });
                clearTimeout(toastTimer.current); // hủy hẹn giờ của thông báo trước
                toastTimer.current = setTimeout(() => setToast(null), 4000);
            }, []);

            const loadMe = useCallback(async () => {
                const { data } = await api.get("/me");
                setMe(data);
                return data;
            }, []);

            // Còn token trong sessionStorage (F5 trang) -> thử lấy lại /me
            useEffect(() => {
                if (!getToken()) return;
                loadMe().catch(() => { }).finally(() => setChecking(false));
            }, [loadMe]);

            // Interceptor báo 401 -> về màn hình đăng nhập
            useEffect(() => {
                const onExpired = () => { setMe(null); notify("error", "Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại."); };
                window.addEventListener("auth:expired", onExpired);
                return () => window.removeEventListener("auth:expired", onExpired);
            }, [notify]);

            const logout = () => { setToken(null); setMe(null); };

            if (checking) return <div className="container">Đang tải…</div>;

            const tabs = [
                can(me, "users:read") && { key: "users", label: "Người dùng" },
                can(me, "roles:read") && { key: "roles", label: "Vai trò" },
                me && { key: "me", label: "Hồ sơ của tôi" },
            ].filter(Boolean);

            const current = tabs.some((t) => t.key === tab) ? tab : tabs[0]?.key;

            return (
                <div className="container">
                    {!me ? (
                        <LoginPage onLoggedIn={loadMe} />
                    ) : (
                        <>
                            <div className="header">
                                <div>
                                    <h1>Quản lý Người dùng &amp; Phân quyền</h1>
                                    <div className="muted">
                                        {me.fullName} ({me.email}) · {me.roles.map((r) => <span key={r.id}
                                            className="badge">{r.name}</span>)}
                                    </div>
                                </div>
                                <button onClick={logout}>Đăng xuất</button>
                            </div>
                            <div className="tabs">
                                {tabs.map((t) => (
                                    <button key={t.key} className={current === t.key ? "active" : ""}
                                        onClick={() => setTab(t.key)}>{t.label}</button>
                                ))}
                            </div>
                            {current === "users" && <UsersPage me={me} notify={notify}
                                reloadMe={loadMe} />}
                            {current === "roles" && <RolesPage me={me} notify={notify}
                                reloadMe={loadMe} />}
                            {current === "me" && <MyProfile me={me} />}
                        </>
                    )}
                    {toast && <div className={`toast ${toast.type}`}>{toast.text}</div>}
                </div>
            );
        }

        //Component Login page 
        function LoginPage({ onLoggedIn }) {
            const [form, setForm] = useState({ email: "", password: "" });
            const [error, setError] = useState(""); const [loading, setLoading] = useState(false);
            
            const handleSubmit = async (e) => {
                e.preventDefault();

                if (!form.email.trim() || !form.password) return setError("Vui lòng nhập email và mật khẩu.");
                
                setLoading(true);
                setError("");

                try {
                    const { data } = await api.post("/auth/tokens", {
                        grantType: "password",
                        email: form.email.trim(), password: form.password
                    });

                    setToken(data.accessToken);
                    await onLoggedIn();
                } catch (err) {
                    setError(err.message); // 401 sai thông tin, 403 bị khóa, 0 lỗi mạng
                } finally {
                    setLoading(false);
                }
            };
            return (
                <form className="login" onSubmit={handleSubmit}>
                    <h1>Đăng nhập</h1>
                    <label>Email</label>
                    <input name="email" type="email" value={form.email} onChange={(e) =>
                        setForm({ ...form, email: e.target.value })} />
                    <label>Mật khẩu</label>
                    <input name="password" type="password" value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} />
                    {error && <p className="error">{error}</p>}
                    <div className="modal-actions">
                        <button className="primary" type="submit" disabled={loading}>{loading ?
                            "Đang đăng nhập…" : "Đăng nhập"}</button>
                    </div>
                </form>
            );
        }

        // Component UsersPage
        function UsersPage({ me, notify, reloadMe }) {
            const [users, setUsers] = useState([]);
            const [meta, setMeta] = useState({
                page: 1, limit: 5, totalItems: 0, totalPages: 1
            });
            const [page, setPage] = useState(1);
            const [limit, setLimit] = useState(5);
            const [search, setSearch] = useState("");
            const [status, setStatus] = useState("");
            const [roleId, setRoleId] = useState("");
            const [roles, setRoles] = useState([]);
            const [editing, setEditing] = useState(undefined); // undefined: đóng, null: thêm mới, object: sửa
            const [assigning, setAssigning] = useState(null);

            const handleError = useCallback((err) => {
                notify("error", err.message);
                if (err.status === 403) reloadMe(); // quyền có thể vừa bị thay đổi -> đồng bộ giao diện
            }, [notify, reloadMe]);

            const fetchUsers = useCallback(async () => {
                const params = { page, limit, sort: "-createdAt" };

                if (search.trim().length >= 2) params.q = search.trim(); // backend yêu cầu ≥ 2 ký tự
                if (status) params.status = status;
                if (roleId) params.roleId = roleId;

                try {
                    const { data } = await api.get("/users", { params });
                    setUsers(data.data);
                    setMeta(data.meta);

                    if (page > data.meta.totalPages) setPage(data.meta.totalPages); // vd. xóa dòng cuối của trang cuối
                } catch (err) {
                    handleError(err);
                }
            }, [page, limit, search, status, roleId, handleError]);

            useEffect(() => { fetchUsers(); }, [fetchUsers]);

            // Danh sách role cho bộ lọc và modal
            useEffect(() => {
                if (!can(me, "roles:read")) return;

                (async () => {
                    try {
                        const { data } = await api.get("/roles", { params: { limit: 100 } });
                        setRoles(data.data);
                    } catch (err) { handleError(err); }
                })();
            }, [me, handleError]);

            // Đổi bộ lọc / số dòng -> quay về trang 1
            const changeFilter = (setter) => (value) => { setter(value); setPage(1); };
            
            const toggleLock = async (user) => {
                const next = user.status === "locked" ? "active" : "locked";
                try {
                    await api.patch(`/users/${user.id}`, { status: next });
                    notify("success", next === "locked" ? `Đã khóa "${user.fullName}".` : `Đã mở khóa "${user.fullName}".`);
                } catch (err) {
                    handleError(err);
                }
                fetchUsers(); // luôn tải lại danh sách (kể cả 404: người dùng đã bị xóa)
            };

            const deleteUser = async (user) => {
                if (!window.confirm(`Bạn có chắc muốn xóa "${user.fullName}"?`)) return;
                try {
                    await api.delete(`/users/${user.id}`); // 204, không có body
                    notify("success", `Đã xóa "${user.fullName}".`);
                } catch (err) {
                    handleError(err);
                }
                fetchUsers(); // trang cuối hết dữ liệu -> fetchUsers tự lùi trang
            };

            return (
                <div>
                    <div className="toolbar">
                        <SearchBar onSearch={changeFilter(setSearch)} />

                        <select value={status} onChange={(e) => changeFilter(setStatus)(e.target.value)}>
                            <option value="">Tất cả trạng thái</option>
                            <option value="active">Hoạt động</option>
                            <option value="locked">Đã khóa</option>
                        </select>

                        {can(me, "roles:read") && (
                            <select value={roleId} onChange={(e) => changeFilter(setRoleId)(e.target.value)}>
                                <option value="">Tất cả vai trò</option>
                                {roles.map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}
                            </select>
                        )}

                        {can(me, "users:create") && (
                            <button className="primary" onClick={() => setEditing(null)}>+ Thêm người dùng</button>
                        )}
                    </div>

                    <UserTable users={users} me={me} offset={(meta.page - 1) * meta.limit}
                        onEdit={setEditing} onAssign={setAssigning} onToggleLock={toggleLock}
                        onDelete={deleteUser} />

                    <Pagination meta={meta} limit={limit} onPageChange={setPage}
                        onLimitChange={changeFilter(setLimit)} />

                    {editing !== undefined && (
                        <UserModal user={editing} roles={roles} me={me} notify={notify}
                            onClose={() => setEditing(undefined)} onSaved={() => {
                                setEditing(undefined); fetchUsers();
                            }} />
                    )}
                    
                    {assigning && (
                        <RoleAssignModal user={assigning} roles={roles} me={me} notify={notify}
                            onClose={() => setAssigning(null)} onSaved={() => {
                                setAssigning(null);
                                fetchUsers();
                            }} />
                    )}
                </div>
            );
        }

        // SearchBar (debounce 400ms)
        function SearchBar({ onSearch }) {
            const [input, setInput] = useState("");

            useEffect(() => {
                const timer = setTimeout(() => onSearch(input), 400);
                return () => clearTimeout(timer);
            }, [input]);

            return <input placeholder="Tìm theo họ tên, email (tối thiểu 2 ký tự)…"
                value={input} onChange={(e) => setInput(e.target.value)} />;
        }

        // Component UserTable
        function UserTable({ users, me, offset, onEdit, onAssign, onToggleLock, onDelete }) {
            return (
                <div className="table-wrap">
                    <table>
                        <thead>
                            <tr><th>STT</th><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr>
                        </thead>
                        <tbody>
                            {users.length === 0 ? (
                                <tr><td colSpan="6" style={{ textAlign: "center" }}>Không có dữ liệu</td></tr>
                            ) : users.map((u, i) => {
                                const isSelf = sameId(u.id, me.id);
                                return (
                                    <tr key={u.id}>
                                        <td>{offset + i + 1}</td>
                                        <td>{u.fullName}{isSelf && " (bạn)"}</td>
                                        <td>{u.email}</td>
                                        <td>{u.roles.map((r) => <span key={r.id} className="badge">{r.name}</span>)}</td>
                                        <td><span className={`badge ${u.status}`}>{u.status === "locked" ? "Đã khóa" : "Hoạt động"}</span></td>
                                        <td className="actions">
                                            {can(me, "users:update") && <button onClick={() => onEdit(u)}>Sửa</button>}
                                            {can(me, "roles:assign") && can(me, "roles:read") &&
                                                <button onClick={() => onAssign(u)}>Vai trò</button>}
                                            {can(me, "users:update") && (
                                                <button disabled={isSelf} onClick={() => onToggleLock(u)}>
                                                    {u.status === "locked" ? "Mở khóa" : "Khóa"}</button>
                                            )}
                                            {can(me, "users:delete") &&
                                                <button className="danger" disabled={isSelf} onClick={() => onDelete(u)}>Xóa</button>}
                                        </td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        }

        // Component Pagination: nhận meta từ server, dropdown 5/10/20
        function Pagination({ meta, limit, onPageChange, onLimitChange }) {
            return (
                <div className="pagination">
                    <div>
                        Hiển thị:{" "}
                        <select value={limit} onChange={(e) => onLimitChange(Number(e.target.value))}>
                            {[5, 10, 20].map((n) => <option key={n} value={n}>{n}</option>)}
                        </select>{" "}
                        dòng/trang · Tổng {meta.totalItems}
                    </div>
                    <div className="pager">
                        <button disabled={meta.page <= 1} onClick={() => onPageChange(meta.page - 1)}>Prev</button>
                        <span>Trang {meta.page}/{meta.totalPages}</span>
                        <button disabled={meta.page >= meta.totalPages} onClick={() => onPageChange(meta.page + 1)}>Next</button>
                    </div>
                </div>
            );
        }

        // Khung modal dùng chung: tiêu đề + nút [X], bấm nền để đóng
        function Modal({ title, onClose, children }) {
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <h3>{title}</h3>
                            <button className="close" onClick={onClose} aria-label="Đóng">×</button>
                        </div>
                        {children}
                    </div>
                </div>
            );
        }

        const PHONE_RE = /^\+[1-9]\d{7,14}$/;
        const PASSWORD_RE = /^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;
        const ROLE_CODE_RE = /^[a-z][a-z0-9-]{2,49}$/;

        // Component UserModal (thêm / sửa)
        function UserModal({ user, roles, me, notify, onClose, onSaved }) {
            const isNew = !user;
            const [form, setForm] = useState({
                email: user?.email || "", fullName: user?.fullName || "", phone: user?.phone || "", password: "", roleIds: [],
            });
            const [errors, setErrors] = useState({});
            const [saving, setSaving] = useState(false);

            const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
            const toggleRole = (id) => setForm({
                ...form,
                roleIds: form.roleIds.includes(id) ? form.roleIds.filter((x) => x !== id) : [...form.roleIds, id],
            });

            const validate = () => {
                const e = {};
                if (!/^\S+@\S+\.\S+$/.test(form.email.trim())) e.email = "Email không hợp lệ";
                if (form.fullName.trim().length < 2) e.fullName = "Họ tên phải có ít nhất 2 ký tự";
                if (form.phone.trim() && !PHONE_RE.test(form.phone.trim()))
                    e.phone = "Số điện thoại theo định dạng E.164, ví dụ +84912345678";
                if (isNew && !PASSWORD_RE.test(form.password))
                    e.password = "Mật khẩu tối thiểu 8 ký tự, có chữ hoa, chữ số và ký tự đặc biệt";
                setErrors(e);
                return Object.keys(e).length === 0;
            };

            const handleSubmit = async () => {
                if (!validate()) return;
                const clean = { email: form.email.trim().toLowerCase(), fullName: form.fullName.trim(), phone: form.phone.trim() || null };
                setSaving(true);
                try {
                    if (isNew) {
                        const body = { ...clean, password: form.password };
                        if (form.roleIds.length) body.roleIds = form.roleIds;
                        await api.post("/users", body);
                    } else {
                        // PATCH: chỉ gửi trường thay đổi
                        const changed = Object.fromEntries(Object.entries(clean).filter(([k, v]) => v !== (user[k] ?? null)));
                        if (Object.keys(changed).length) await api.patch(`/users/${user.id}`, changed);
                    }
                    notify("success", isNew ? "Tạo người dùng thành công." : "Cập nhật người dùng thành công.");
                    onSaved();
                } catch (err) {
                    // 400: lỗi theo từng trường; 409: email trùng
                    const fieldErrors = {};
                    err.details.forEach((d) => { if (d.field) fieldErrors[d.field] = d.message; });
                    if (err.code === "EMAIL_ALREADY_EXISTS") fieldErrors.email = err.message;
                    setErrors(fieldErrors);
                    if (!Object.keys(fieldErrors).length) notify("error", err.message);
                } finally {
                    setSaving(false);
                }
            };

            const field = (key, label, type = "text") => (
                <div className="field">
                    <label>{label}</label>
                    <input type={type} value={form[key]} onChange={set(key)} />
                    {errors[key] && <p className="error">{errors[key]}</p>}
                </div>
            );

            return (
                <Modal title={isNew ? "Thêm người dùng" : "Sửa người dùng"} onClose={onClose}>
                    {field("email", "Email *", "email")}
                    {field("fullName", "Họ tên *")}
                    {field("phone", "Số điện thoại")}
                    {isNew && field("password", "Mật khẩu *", "password")}

                    {isNew && can(me, "roles:assign") && roles.length > 0 && (
                        <div className="field">
                            <label>Vai trò</label>
                            {roles.map((r) => {
                                const id = String(r.id);
                                const missing = r.permissions.filter((p) => !me.permissions.includes(p));
                                return (
                                    <label key={id} className="check">
                                        <input type="checkbox" checked={form.roleIds.includes(id)}
                                            disabled={missing.length > 0} onChange={() => toggleRole(id)} />
                                        <span>{r.name}{missing.length > 0 && <span className="muted"> — vượt quyền của bạn</span>}</span>
                                    </label>
                                );
                            })}
                            {errors.roleIds && <p className="error">{errors.roleIds}</p>}
                        </div>
                    )}

                    <div className="modal-actions">
                        <button className="primary" onClick={handleSubmit} disabled={saving}>{saving ? "Đang lưu…" : "Lưu"}</button>
                        <button onClick={onClose}>Hủy</button>
                    </div>
                </Modal>
            );
        }

        // Component RoleAssignModal (gán / gỡ vai trò, Promise.allSettled)
        function RoleAssignModal({ user, roles, me, notify, onClose, onSaved }) {
            const initial = user.roles.map((r) => String(r.id));
            const [selected, setSelected] = useState(initial);
            const [saving, setSaving] = useState(false);
            const isSelf = sameId(user.id, me.id);

            const toggle = (id) => setSelected(selected.includes(id) ? selected.filter((x) => x !== id) : [...selected, id]);

            const handleSave = async () => {
                const toAdd = selected.filter((id) => !initial.includes(id));
                const toRemove = initial.filter((id) => !selected.includes(id));
                const ops = [
                    ...toAdd.map((id) => ({ id, action: "gán", run: () => api.put(`/users/${user.id}/roles/${id}`) })),
                    ...toRemove.map((id) => ({ id, action: "gỡ", run: () => api.delete(`/users/${user.id}/roles/${id}`) })),
                ];
                if (!ops.length) return onClose();

                setSaving(true);
                // Chạy song song, chờ TẤT CẢ kết thúc dù có thao tác thất bại
                const results = await Promise.allSettled(ops.map((op) => op.run()));
                setSaving(false);

                const failed = results
                    .map((r, i) => ({ r, op: ops[i] }))
                    .filter(({ r }) => r.status === "rejected")
                    .map(({ r, op }) => `Không thể ${op.action} "${roles.find((x) => sameId(x.id, op.id))?.name}": ${r.reason.message}`);

                if (failed.length) notify("error", failed.join(" "));
                else notify("success", `Đã cập nhật vai trò cho ${user.fullName}.`);
                onSaved();
            };

            return (
                <Modal title={`Vai trò của ${user.fullName}`} onClose={onClose}>
                    {roles.map((r) => {
                        const id = String(r.id);
                        const missing = r.permissions.filter((p) => !me.permissions.includes(p));
                        const lockedSelf = isSelf && initial.includes(id); // không tự gỡ role của mình
                        return (
                            <label key={id} className="check">
                                <input type="checkbox" checked={selected.includes(id)}
                                    disabled={missing.length > 0 || lockedSelf} onChange={() => toggle(id)} />
                                <span>
                                    <b>{r.name}</b> <span className="muted">({r.code}, {r.permissions.length} quyền)</span>
                                    {missing.length > 0 && <span className="muted"> — vượt quyền của bạn</span>}
                                    {lockedSelf && <span className="muted"> — không thể tự gỡ</span>}
                                </span>
                            </label>
                        );
                    })}
                    <div className="modal-actions">
                        <button className="primary" onClick={handleSave} disabled={saving}>{saving ? "Đang lưu…" : "Lưu"}</button>
                        <button onClick={onClose}>Hủy</button>
                    </div>
                </Modal>
            );
        }

        // Component RolesPage
        function RolesPage({ me, notify, reloadMe }) {
            const [roles, setRoles] = useState([]);
            const [catalog, setCatalog] = useState([]);
            const [editing, setEditing] = useState(undefined); // undefined: đóng, null: thêm mới, object: sửa

            const handleError = useCallback((err) => {
                notify("error", err.message);
                if (err.status === 403) reloadMe(); // quyền có thể vừa bị thay đổi -> đồng bộ giao diện
            }, [notify, reloadMe]);

            const fetchRoles = useCallback(async () => {
                try {
                    const { data } = await api.get("/roles", { params: { limit: 100 } });
                    setRoles(data.data);
                } catch (err) {
                    handleError(err);
                }
            }, [handleError]);

            // Tải song song danh sách vai trò và danh mục quyền (khi có permissions:read)
            useEffect(() => {
                (async () => {
                    try {
                        const [rolesRes, permsRes] = await Promise.all([
                            api.get("/roles", { params: { limit: 100 } }),
                            can(me, "permissions:read") ? api.get("/permissions") : Promise.resolve(null),
                        ]);
                        setRoles(rolesRes.data.data);
                        if (permsRes) setCatalog(permsRes.data.data);
                    } catch (err) {
                        handleError(err);
                    }
                })();
            }, [me, handleError]);

            const deleteRole = async (role) => {
                if (!window.confirm(`Bạn có chắc muốn xóa vai trò "${role.name}"?`)) return;
                try {
                    await api.delete(`/roles/${role.id}`);
                    notify("success", `Đã xóa vai trò "${role.name}".`);
                } catch (err) {
                    handleError(err); // 409: vai trò đang dùng / vai trò hệ thống
                }
                fetchRoles();
            };

            return (
                <div>
                    <div className="toolbar">
                        {can(me, "roles:create") && (
                            <button className="primary" onClick={() => setEditing(null)}>+ Thêm vai trò</button>
                        )}
                    </div>

                    <div className="table-wrap">
                        <table>
                            <thead>
                                <tr><th>Mã</th><th>Tên</th><th>Quyền</th><th>Người dùng</th><th>Loại</th><th>Thao tác</th></tr>
                            </thead>
                            <tbody>
                                {roles.length === 0 ? (
                                    <tr><td colSpan="6" style={{ textAlign: "center" }}>Không có dữ liệu</td></tr>
                                ) : roles.map((r) => (
                                    <tr key={r.id}>
                                        <td><code>{r.code}</code></td>
                                        <td>{r.name}{r.description && <div className="muted">{r.description}</div>}</td>
                                        <td>{r.permissions.map((p) => <span key={p} className="badge">{p}</span>)}</td>
                                        <td>{r.userCount}</td>
                                        <td>{r.isSystem
                                            ? <span className="badge system">Hệ thống</span>
                                            : <span className="badge">Tùy chỉnh</span>}</td>
                                        <td className="actions">
                                            {can(me, "roles:update") && <button onClick={() => setEditing(r)}>Sửa</button>}
                                            {can(me, "roles:delete") && !r.isSystem &&
                                                <button className="danger" onClick={() => deleteRole(r)}>Xóa</button>}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {editing !== undefined && (
                        <RoleModal role={editing} catalog={catalog} me={me} notify={notify}
                            onClose={() => setEditing(undefined)} onSaved={() => {
                                setEditing(undefined);
                                fetchRoles();
                                reloadMe(); // người đang đăng nhập có thể mang vai trò vừa sửa
                            }} />
                    )}
                </div>
            );
        }

        // Component RoleModal (thêm / sửa, checkbox quyền theo nhóm)
        function RoleModal({ role, catalog, me, notify, onClose, onSaved }) {
            const isNew = !role;
            const [form, setForm] = useState({
                code: "", name: role?.name || "", description: role?.description || "",
            });
            const [perms, setPerms] = useState(role ? [...role.permissions] : []);
            const [errors, setErrors] = useState({});
            const [saving, setSaving] = useState(false);

            const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
            const togglePerm = (code) => setPerms(perms.includes(code) ? perms.filter((p) => p !== code) : [...perms, code]);

            // Nhóm danh mục quyền theo resource: { users: [...], roles: [...], permissions: [...] }
            const groups = catalog.reduce((acc, p) => ({ ...acc, [p.resource]: [...(acc[p.resource] || []), p] }), {});

            const validate = () => {
                const e = {};
                if (isNew && !ROLE_CODE_RE.test(form.code.trim()))
                    e.code = "Mã vai trò: chữ thường, số, gạch nối; 3–50 ký tự; bắt đầu bằng chữ";
                if (form.name.trim().length < 2) e.name = "Tên vai trò phải có ít nhất 2 ký tự";
                setErrors(e);
                return Object.keys(e).length === 0;
            };

            const handleSubmit = async () => {
                if (!validate()) return;
                const clean = { name: form.name.trim(), description: form.description.trim() || null };
                setSaving(true);
                try {
                    if (isNew) {
                        await api.post("/roles", { code: form.code.trim(), ...clean, permissions: perms });
                    } else {
                        // PATCH nếu tên/mô tả đổi, rồi PUT permissions nếu bộ quyền đổi
                        const info = Object.fromEntries(Object.entries(clean).filter(([k, v]) => v !== (role[k] ?? null)));
                        if (Object.keys(info).length) await api.patch(`/roles/${role.id}`, info);

                        const changed = perms.length !== role.permissions.length || perms.some((p) => !role.permissions.includes(p));
                        if (!role.isSystem && changed) await api.put(`/roles/${role.id}/permissions`, { permissions: perms });
                    }
                    notify("success", isNew ? "Tạo vai trò thành công." : "Cập nhật vai trò thành công.");
                    onSaved();
                } catch (err) {
                    const fieldErrors = {};
                    err.details.forEach((d) => { if (d.field) fieldErrors[d.field] = d.message; });
                    if (err.code === "ROLE_CODE_EXISTS") fieldErrors.code = err.message;
                    setErrors(fieldErrors);
                    if (!Object.keys(fieldErrors).length) notify("error", err.message);
                } finally {
                    setSaving(false);
                }
            };

            return (
                <Modal title={isNew ? "Thêm vai trò" : `Sửa vai trò ${role.code}`} onClose={onClose}>
                    {isNew && (
                        <div className="field">
                            <label>Mã vai trò *</label>
                            <input value={form.code} onChange={set("code")} placeholder="vd. tro-giang" />
                            {errors.code && <p className="error">{errors.code}</p>}
                        </div>
                    )}
                    <div className="field">
                        <label>Tên vai trò *</label>
                        <input value={form.name} onChange={set("name")} />
                        {errors.name && <p className="error">{errors.name}</p>}
                    </div>
                    <div className="field">
                        <label>Mô tả</label>
                        <textarea value={form.description} onChange={set("description")} />
                        {errors.description && <p className="error">{errors.description}</p>}
                    </div>

                    <div className="field">
                        <label>Quyền</label>
                        {role?.isSystem && <p className="muted">Vai trò hệ thống: không được đổi bộ quyền.</p>}
                        {catalog.length === 0 && <p className="muted">Cần quyền permissions:read để xem danh mục quyền.</p>}
                        {Object.entries(groups).map(([resource, items]) => (
                            <fieldset key={resource} className="perm-group">
                                <legend>{resource}</legend>
                                {items.map((p) => {
                                    const notHeld = !me.permissions.includes(p.code);
                                    return (
                                        <label key={p.code} className="check">
                                            <input type="checkbox" checked={perms.includes(p.code)}
                                                disabled={!!role?.isSystem || notHeld} onChange={() => togglePerm(p.code)} />
                                            <span>
                                                <code>{p.code}</code> <span className="muted">{p.description}</span>
                                                {notHeld && <span className="muted"> — bạn không có quyền này</span>}
                                            </span>
                                        </label>
                                    );
                                })}
                            </fieldset>
                        ))}
                        {errors.permissions && <p className="error">{errors.permissions}</p>}
                    </div>

                    <div className="modal-actions">
                        <button className="primary" onClick={handleSubmit} disabled={saving}>{saving ? "Đang lưu…" : "Lưu"}</button>
                        <button onClick={onClose}>Hủy</button>
                    </div>
                </Modal>
            );
        }

        // Component MyProfile: thông tin + quyền hiệu lực từ GET /me
        function MyProfile({ me }) {
            return (
                <div className="profile">
                    <p><b>Họ tên:</b> {me.fullName}</p>
                    <p><b>Email:</b> {me.email}</p>
                    <p><b>Số điện thoại:</b> {me.phone || <span className="muted">(chưa có)</span>}</p>
                    <p><b>Vai trò:</b> {me.roles.length
                        ? me.roles.map((r) => <span key={r.id} className="badge">{r.name}</span>)
                        : <span className="muted">(không có)</span>}</p>
                    <p><b>Quyền hiệu lực:</b> {me.permissions.length
                        ? me.permissions.map((p) => <span key={p} className="badge">{p}</span>)
                        : <span className="muted">(không có quyền quản trị)</span>}</p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
