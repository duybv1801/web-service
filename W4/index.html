<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý người dùng - React CRUD</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const emptyUser = {
      name: "", username: "", email: "",
      address: { street: "", suite: "", city: "" },
      phone: "", website: ""
    };

    const fields = [
      { id: "name", label: "Họ tên" },
      { id: "username", label: "Username" },
      { id: "email", label: "Email" },
      { id: "street", label: "Street", nested: true },
      { id: "suite", label: "Suite", nested: true },
      { id: "city", label: "City", nested: true },
      { id: "phone", label: "Số điện thoại" },
      { id: "website", label: "Website" }
    ];

    // Form dùng chung cho Thêm và Sửa, hiển thị trong modal
    function UserForm({ title, data, onChange, onSubmit, onCancel, submitText }) {
      return (
        <div className="modal-overlay" onClick={onCancel}>
          <div className="modal-content" onClick={(e) => e.stopPropagation()}>
            <h4>{title}</h4>
            {fields.map((f) => (
              <div className="form-group" key={f.id}>
                <label htmlFor={f.id}>{f.label}</label>
                <input
                  id={f.id}
                  type="text"
                  value={f.nested ? data.address[f.id] : data[f.id]}
                  onChange={onChange}
                />
              </div>
            ))}
            <div className="modal-actions">
              <button className="btn-secondary" onClick={onCancel}>Hủy</button>
              <button className="btn-primary" onClick={onSubmit}>{submitText}</button>
            </div>
          </div>
        </div>
      );
    }

    function SearchForm({ onChangeValue }) {
      return (
        <input
          className="search-input"
          type="text"
          placeholder="Tìm theo name, username"
          onChange={(e) => onChangeValue(e.target.value)}
        />
      );
    }

    function AddUser({ onAdd }) {
      const [adding, setAdding] = React.useState(false);
      const [user, setUser] = React.useState(emptyUser);

      const handleChange = (e) => {
        const { id, value } = e.target;
        if (["street", "suite", "city"].includes(id)) {
          setUser({ ...user, address: { ...user.address, [id]: value } });
        } else {
          setUser({ ...user, [id]: value });
        }
      };

      const handleAdd = () => {
        if (user.name.trim() === "" || user.username.trim() === "") {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        onAdd(user);
        setUser(emptyUser);
        setAdding(false);
      };

      return (
        <div>
          <button className="btn-primary" onClick={() => setAdding(true)}>+ Thêm</button>
          {adding && (
            <UserForm
              title="Thêm người dùng"
              data={user}
              onChange={handleChange}
              onSubmit={handleAdd}
              onCancel={() => setAdding(false)}
              submitText="Thêm"
            />
          )}
        </div>
      );
    }

    function ResultTable({ keyword, user, onAdded }) {
      const [users, setUsers] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [editing, setEditing] = React.useState(null);

      // Tải dữ liệu 1 lần khi component mount
      React.useEffect(() => {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => res.json())
          .then((data) => { setUsers(data); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);

      // Khi prop user thay đổi -> thêm vào danh sách
      React.useEffect(() => {
        if (user) {
          setUsers((prev) => {
            const nextId = prev.reduce((max, u) => Math.max(max, u.id), 0) + 1;
            return [...prev, { ...user, id: nextId }];
          });
          onAdded();
        }
      }, [user]);

      const filteredUsers = users.filter(
        (u) =>
          u.name.toLowerCase().includes(keyword.toLowerCase()) ||
          u.username.toLowerCase().includes(keyword.toLowerCase())
      );

      // Deep copy để form sửa không làm thay đổi dữ liệu gốc
      function editUser(user) {
        setEditing({ ...user, address: { ...user.address } });
      }

      function handleEditChange(e) {
        const { id, value } = e.target;
        if (["street", "suite", "city"].includes(id)) {
          setEditing({ ...editing, address: { ...editing.address, [id]: value } });
        } else {
          setEditing({ ...editing, [id]: value });
        }
      }

      function saveUser() {
        if (editing.name.trim() === "" || editing.username.trim() === "") {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        setUsers((prev) => prev.map((u) => (u.id === editing.id ? editing : u)));
        setEditing(null);
      }

      function removeUser(id) {
        // Giữ lại tất cả người dùng có id khác với id cần xóa
        setUsers((prev) => prev.filter((u) => u.id !== id));
      }

      if (loading) return <div className="status">Đang tải dữ liệu...</div>;

      return (
        <div className="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Họ tên</th>
                <th>Username</th>
                <th>Email</th>
                <th>Địa chỉ</th>
                <th>Số điện thoại</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              {filteredUsers.map((u) => (
                <tr key={u.id}>
                  <td>{u.id}</td>
                  <td>{u.name}</td>
                  <td>{u.username}</td>
                  <td>{u.email}</td>
                  <td>{u.address.street}, {u.address.suite}, {u.address.city}</td>
                  <td>{u.phone}</td>
                  <td>
                    <button className="btn-edit" onClick={() => editUser(u)}>Sửa</button>
                    <button className="btn-delete" onClick={() => removeUser(u.id)}>Xóa</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          {filteredUsers.length === 0 && <div className="status">Không tìm thấy người dùng nào.</div>}

          {editing && (
            <UserForm
              title="Sửa người dùng"
              data={editing}
              onChange={handleEditChange}
              onSubmit={saveUser}
              onCancel={() => setEditing(null)}
              submitText="Lưu"
            />
          )}
        </div>
      );
    }

    function App() {
      const [kw, setKeyword] = React.useState("");
      const [newUser, setNewUser] = React.useState(null);
      return (
        <div className="container">
          <h1>Quản lý người dùng</h1>
          <div className="toolbar">
            <SearchForm onChangeValue={setKeyword} />
            <AddUser onAdd={setNewUser} />
          </div>
          <ResultTable keyword={kw} user={newUser} onAdded={() => setNewUser(null)} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
